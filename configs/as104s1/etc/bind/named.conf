// AS104: authoritative for isp104.lab + 104.1.in-addr.arpa, plus recursive resolver
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    allow-recursion { 1.104.0.0/20; };
    dnssec-validation no;
};

// emulated root DNS: ROOT-SERVER. = 1.0.1.2
zone "." {
    type hint;
    file "/etc/bind/db.root";
};

zone "isp104.lab" {
    type master;
    file "/etc/bind/db.isp104.lab";
    allow-query { any; };
};

zone "104.1.in-addr.arpa" {
    type master;
    file "/etc/bind/db.1.104";
    allow-query { any; };
};
