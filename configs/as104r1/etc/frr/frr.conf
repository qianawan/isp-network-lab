frr version 9.1.3
frr defaults traditional
hostname as104r1
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 1.0.0.5/31
exit
!
interface eth1
 ip address 1.104.0.21/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 1.104.0.17/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth3
 ip address 1.104.0.33/30
 ip ospf cost 11
 ip ospf network point-to-point
exit
!
interface dummy0
 ip address 1.104.0.1/32
exit
!
router ospf
 ospf router-id 1.104.0.1
 network 1.104.0.0/26 area 0
 passive-interface dummy0
 default-information originate always metric 1
exit
!
!
ip prefix-list PL-OUR-AGG seq 10 permit 1.104.0.0/20
ip prefix-list PL-AS1-OWN seq 10 permit 1.0.0.0/20
ip prefix-list PL-AS21 seq 10 permit 2.21.0.0/20
!
route-map FROM-AS1 permit 10
 match ip address prefix-list PL-AS1-OWN
 set local-preference 200
!
route-map TO-AS1 permit 20
 match ip address prefix-list PL-AS21
 set as-path prepend 104
!
route-map FROM-AS1 permit 20
 match ip address prefix-list PL-AS21
 set local-preference 50
!
route-map FROM-AS1 permit 100
 set local-preference 200
!
route-map TO-AS1 permit 10
 match ip address prefix-list PL-OUR-AGG
 set community 1:200
!
router bgp 104
 no bgp network import-check
 bgp router-id 1.104.0.1
 neighbor 1.0.0.4 remote-as 1
 neighbor 1.104.0.2 remote-as 104
 neighbor 1.104.0.2 update-source dummy0
 neighbor 1.104.0.2 description iBGP-to-r2
 !
 address-family ipv4 unicast
  network 1.104.0.0/20
  neighbor 1.0.0.4 activate
  neighbor 1.0.0.4 send-community
  neighbor 1.104.0.2 activate
  neighbor 1.104.0.2 next-hop-self
  neighbor 1.0.0.4 route-map FROM-AS1 in
  neighbor 1.0.0.4 route-map TO-AS1 out
 exit-address-family
!

