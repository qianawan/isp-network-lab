frr version 9.1.3
frr defaults traditional
hostname as104r3
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 1.104.1.1/24
exit
!
interface eth1
 ip address 1.104.0.30/30
 ip ospf cost 12
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 1.104.0.26/30
 ip ospf cost 15
 ip ospf network point-to-point
exit
!
interface eth3
 ip address 1.104.0.34/30
 ip ospf cost 11
 ip ospf network point-to-point
exit
!
interface dummy0
 ip address 1.104.0.3/32
exit
!
router ospf
 ospf router-id 1.104.0.3
 network 1.104.0.0/26 area 0
 network 1.104.1.0/24 area 0
 passive-interface dummy0
 passive-interface eth0
exit
!
