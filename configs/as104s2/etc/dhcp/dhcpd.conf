# AS104 - DHCP server on s2 (dhcpd.isp104.lab)
authoritative;
ddns-update-style none;

default-lease-time 600;
max-lease-time 7200;

option domain-name "isp104.lab";
option domain-name-servers 1.104.1.2;

# Server LAN: no pool, but the subnet MUST be declared,
# otherwise dhcpd ignores every request arriving on eth0.
subnet 1.104.1.0 netmask 255.255.255.0 {
    option routers 1.104.1.1;
}

# Client LAN: reachable through the DHCP relay on r4
subnet 1.104.2.0 netmask 255.255.255.0 {
    range 1.104.2.100 1.104.2.150;
    option routers 1.104.2.1;
    option subnet-mask 255.255.255.0;
    option broadcast-address 1.104.2.255;
}

host c1 {
    host-identifier option dhcp-client-identifier "c1";
    fixed-address 1.104.2.2;
    option host-name "c1";
}

host c2 {
    host-identifier option dhcp-client-identifier "c2";
    fixed-address 1.104.2.3;
    option host-name "c2";
}
