
frr version 9.1.3
frr defaults traditional
hostname as104r2
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 2.21.0.1/31
exit
!
ip prefix-list PL-OUR-AGG seq 10 permit 1.104.0.0/20
!
bgp as-path access-list 10 permit ^1_
!
route-map TO-AS21 permit 10
 match ip address prefix-list PL-OUR-AGG
 set as-path prepend 104
!
route-map TO-AS21 permit 20
 match as-path 10
 set as-path prepend 104
!
interface eth1
 ip address 1.104.0.22/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 1.104.0.25/30
 ip ospf cost 15
 ip ospf network point-to-point
exit
!
interface dummy0
 ip address 1.104.0.2/32
exit
!
ip prefix-list PL-AS21 seq 10 permit 2.21.0.0/20
!
route-map FROM-AS21 permit 10
 match ip address prefix-list PL-AS21
 set local-preference 100
!
route-map FROM-AS21 permit 20
!
route-map RM-AS21-ONLY permit 10
 match ip address prefix-list PL-AS21
!
router ospf
 ospf router-id 1.104.0.2
 network 1.104.0.0/26 area 0
 passive-interface dummy0
 default-information originate always metric 20
 redistribute bgp route-map RM-AS21-ONLY
exit
!
!
router bgp 104
 no bgp network import-check
 bgp router-id 1.104.0.2
 neighbor 1.104.0.1 remote-as 104
 neighbor 1.104.0.1 update-source dummy0
 neighbor 1.104.0.1 description iBGP-to-r1
 neighbor 2.21.0.0 remote-as 21
 neighbor 2.21.0.0 description eBGP-to-AS21
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 1.104.0.0/20
  neighbor 1.104.0.1 activate
  neighbor 1.104.0.1 next-hop-self
  neighbor 2.21.0.0 activate
  neighbor 2.21.0.0 route-map TO-AS21 out
  neighbor 2.21.0.0 route-map FROM-AS21 in
 exit-address-family
exit
!

